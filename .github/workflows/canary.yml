name: Canary Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Optional suffix starting with '-', followed by letters, digits, dots, underscores, or hyphens (defaults to -canary.<short_sha>)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Resolve Canary metadata
        id: meta
        shell: bash
        env:
          SUFFIX: ${{ inputs.version_suffix }}
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          if [ -z "$SUFFIX" ]; then
            SUFFIX="-canary.${SHORT_SHA}"
          elif [[ ! "$SUFFIX" =~ ^-[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
            echo "::error::Invalid version suffix; use a leading hyphen followed by letters, digits, dots, underscores, or hyphens."
            exit 1
          fi
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Canary APK
        id: build
        env:
          SUFFIX: ${{ steps.meta.outputs.suffix }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --no-daemon -PVERSION_NAME_SUFFIX="$SUFFIX"
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
            OUT_NAME="ColorOSBgManager${SUFFIX}-release.apk"
            SIGNED="true"
          else
            ./gradlew assembleDebug --no-daemon -PVERSION_NAME_SUFFIX="$SUFFIX"
            SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
            OUT_NAME="ColorOSBgManager${SUFFIX}-debug.apk"
            SIGNED="false"
          fi
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$SRC_APK" "$RUNNER_TEMP/dist/$OUT_NAME"
          echo "apk_path=$RUNNER_TEMP/dist/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14

      - name: Upload Canary APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk_name }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 14

      - name: Write build summary
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          APK_NAME: ${{ steps.build.outputs.apk_name }}
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          {
            echo "### Canary Build Ready"
            printf '%s\n' "- Commit: \`$SHORT_SHA\`"
            printf '%s\n' "- Artifact: \`$APK_NAME\`"
            printf '%s\n' "- Signed Release: \`$SIGNED\`"
            echo "- Tests: \`testDebugUnitTest\` passed"
          } >> "$GITHUB_STEP_SUMMARY"
